<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #283021;
        --ink-3: #6b6f63;
        --cream: #f1ece1;
        --rule: #d9d2c4;
        --accent: #283021;
        --money: #3f6f4b;
        --flag: #a4402f;
      }
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        padding: 12px 14px 14px;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--cream);
        font-size: 13px;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 700;
      }
      .sub { color: var(--ink-3); font-size: 11px; margin-bottom: 10px; }
      label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 8px 0 2px; }
      input, select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: #fff;
        font-size: 13px;
        color: var(--ink);
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; min-width: 0; }
      img#thumb { width: 100%; max-height: 120px; object-fit: contain; border: 1px solid var(--rule); border-radius: 6px; background: #fff; margin-top: 8px; display: none; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        border: 1px solid var(--ink);
        border-radius: 6px;
        background: var(--ink);
        color: var(--cream);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
      #status.ok { color: var(--money); }
      #status.err { color: var(--flag); }
      details { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 8px; }
      summary { cursor: pointer; font-size: 11px; color: var(--ink-3); }
      .config-note { font-size: 11px; color: var(--flag); margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h1>Clip to SJC OS</h1>
    <div class="sub" id="page-host"></div>

    <div id="config-warning" class="config-note" style="display:none">
      Set the endpoint &amp; token below before clipping.
    </div>

    <img id="thumb" alt="" />

    <label>Name</label>
    <input id="name" />

    <div class="row">
      <div>
        <label>Price</label>
        <input id="price" placeholder="$0.00" />
      </div>
      <div>
        <label>Category</label>
        <select id="category">
          <option>Cabinets</option>
          <option>Counters</option>
          <option>Tile</option>
          <option>Flooring</option>
          <option>Hardware</option>
          <option>Plumbing</option>
          <option>Lighting</option>
          <option>Trim</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Supplier</label>
        <input id="supplier" />
      </div>
      <div>
        <label>SKU</label>
        <input id="sku" />
      </div>
    </div>

    <button id="clip">Clip to catalog</button>
    <div id="status"></div>

    <details id="config">
      <summary>Connection settings</summary>
      <label>Endpoint URL</label>
      <input id="endpoint" placeholder="https://os.sjcarpentryllc.com/api/catalog/clip" />
      <label>Clip token</label>
      <input id="token" type="password" placeholder="paste from Settings → Integrations" />
      <button id="save-config" style="background:#fff;color:var(--ink)">Save settings</button>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
