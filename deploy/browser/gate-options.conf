# REVIEW SPEC ONLY: option names/parser behavior require pinned-runtime evidence.
# The sjc-mitmdump launcher MUST reject unknown/incompatible options and attest
# addon + dispatcher. No optional addon or stock-runtime fallback.
mode: regular
listen_host: 10.203.0.2
# Two independently bound listener generations: 18081 and 18082.
# Launcher must create both, map one context to each, revoke all connections on reuse.
listen_port: 18081
connection_strategy: lazy
stream_large_bodies: null
body_size_limit: 25m
http2: false
websocket: false
rawtcp: false
ignore_hosts: []
upstream_cert: false
ssl_insecure: false
flow_detail: 0
termlog_verbosity: error
# No streamfile, HAR, replay, web UI, content logs, upstream proxy, allow-host
# passthrough, compression decoder or flow history. Private CA via LoadCredential.
# Mandatory SJC extensions (NOT upstream mitmproxy options):
# max_connections=128, max_connections_per_task=32, upstreams_per_task=8
# connect_timeout=10s, headers_timeout=30s, body_read_timeout=15s, total=60s
# request_pool=56MiB, response_pool=112MiB, transport_pool=24MiB
# response_slots=2, slot_bytes=56MiB, per_direction_queue=64KiB
# baseline<=144MiB, accounted_peak<=336MiB, cap=384MiB, no borrowing/spill
# Accept-Encoding frozen to identity; non-identity Content-Encoding rejected.
# requestheaders: reject TE/trailers/Expect/duplicate or unknown/oversize lengths,
# compressed bodies and headers>32KiB BEFORE read; reserve worst-case copies.
# request: after bounded full collection, freeze/HMAC, RPC decision, then pin dial.
# responseheaders: stream=False; reject oversize/ambiguous/trailer/upgrade/encoding.
# request+response parser allocations must charge ledger BEFORE allocation.
