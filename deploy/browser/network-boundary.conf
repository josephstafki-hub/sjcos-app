# REVIEW SPEC ONLY — NOT an executable setup script. Root must implement,
# attest and test this topology before any runtime starts. No install in slice C.
#
# browser namespace: sjcos-browser; private veth browser0=10.203.0.1/30
# gate namespace: sjcos-browser-gate; peer browser0=10.203.0.2/30
# gate public uplink is a DIFFERENT veth, with root-managed public-only routing.
# Browser has NO default route except gate listener sockets; no host routes/NAT
# exposing CDP. Host has NO route/forward/listener into browser namespace.
# Controller socket + scoped PostgreSQL socket and gate RPC are AF_UNIX only.
# Namespace creation, nft rules, Unbound config, routes and IP forwarding root-only.
# Runtime UIDs have no CAP_NET_ADMIN, sudo, nft or namespace escape capabilities.
#
# Apply inet rules separately INSIDE each namespace (no flush of host rules):
# BROWSER: INPUT/OUTPUT/FORWARD policy drop, IPv4 AND IPv6.
#   allow loopback namespace-only CDP; remote-debugging-port=0, actual rev1248
#   listener proof required. No unsupported remote-debugging-address assumption.
#   output oif browser0 ip daddr 10.203.0.2 tcp dport {18081,18082} accept
#   input iif browser0 ip saddr 10.203.0.2 tcp sport {18081,18082}
#     ct state established accept
#   NO UDP, DNS/DoH direct route, QUIC, IPv6 egress, other TCP or host route.
# GATE: INPUT/OUTPUT/FORWARD policy drop, IPv4 AND IPv6.
#   input browser0 ip saddr 10.203.0.1 tcp dport {18081,18082} accept
#   output browser0 ip daddr 10.203.0.1 tcp sport {18081,18082}
#     ct state established accept
#   loopback restricted to gate UID -> dedicated local Unbound TCP/UDP 53;
#   gate upstream output tcp dport 443 only through public uplink, exclude
#     ALL IANA non-global/special address ranges AND every app/alternate/tunnel
#     host public IP (v4/v6), including this server's public IP aliases.
#   input uplink: ESTABLISHED replies only, never new inbound sockets.
#   Unbound UID only: fixed validating upstream 9.9.9.9 TCP853 with TLS hostname
#     dns.quad9.net + DNSSEC validation. No gate process external DNS sockets.
#   Unbound root-owned non-global deny list follows complete CNAME/A/AAAA chain;
#     no partial/mixed answers. Default deny config if list/validation unavailable.
#   NO generic established accept ahead of address deny/revocation rules.
#   NO INPUT from host, no route to app/CDP/DB, no passthrough CONNECT.
#
# The gate may use IPv6 global unicast upstream only if equivalently enforced;
# until actual IPv6 peer-pinning and firewall evidence, keep gate IPv6 disabled.
# Deny lists are rendered from a reviewed, dated RFC6890/IANA registry snapshot,
# not a short RFC1918-only list. Pure JS policy is an additional boundary.
# Runtime must refuse stale/missing host-alias and public-address inventory.
# Route/DNS/firewall checks must prove absence of access from alternate veth,
# host-loopback, metadata, same-host public aliases, UDP, QUIC, IPv6 transition
# and mapped tricks, including existing connections after controller/Fetch loss.
