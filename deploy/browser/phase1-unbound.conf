server:
  interface: 10.204.0.2
  port: 53
  username: ""
  chroot: ""
  directory: "/run/sjcos-browser-dns"
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 0
  num-threads: 1
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  access-control: 0.0.0.0/0 refuse
  access-control: 10.204.0.2/32 allow
  hide-identity: yes
  hide-version: yes
  msg-cache-size: 4m
  rrset-cache-size: 8m
  key-cache-size: 2m
  neg-cache-size: 1m
  outgoing-range: 32
  num-queries-per-thread: 32
  so-rcvbuf: 64k
  so-sndbuf: 64k
  harden-glue: yes
  harden-dnssec-stripped: yes
  module-config: "iterator"
forward-zone:
  name: "."
  forward-addr: 9.9.9.9
  forward-addr: 149.112.112.112
