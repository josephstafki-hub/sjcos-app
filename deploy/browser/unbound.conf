# Disposable fixture resolver spec. Root supplies reviewed DNSSEC trust anchor
# and fixture zones; never point production resolver at a synthetic fixture zone.
server:
    interface: 10.204.0.2
    port: 53
    access-control: 10.204.0.1/32 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    do-daemonize: no
    username: "sjcos-browser-dns"
    chroot: ""
    use-syslog: no
    logfile: "/dev/null"
    verbosity: 0
    log-queries: no
    log-replies: no
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    val-permissive-mode: no
    qname-minimisation: yes
    num-threads: 1
    msg-cache-size: 2m
    rrset-cache-size: 4m
    key-cache-size: 1m
    neg-cache-size: 1m
    outgoing-range: 32
    num-queries-per-thread: 32
    cache-max-ttl: 60
    cache-max-negative-ttl: 10
    private-address: 0.0.0.0/8
    private-address: 10.0.0.0/8
    private-address: 100.64.0.0/10
    private-address: 127.0.0.0/8
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 192.0.0.0/24
    private-address: 192.0.2.0/24
    private-address: 192.88.99.0/24
    private-address: 192.168.0.0/16
    private-address: 198.18.0.0/15
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 224.0.0.0/4
    private-address: 240.0.0.0/4
    private-address: 168.63.129.16/32
    private-address: ::/96
    private-address: ::ffff:0:0/96
    private-address: 64:ff9b::/96
    private-address: 64:ff9b:1::/48
    private-address: 100::/64
    private-address: 2001::/23
    private-address: 2001:db8::/32
    private-address: 2002::/16
    private-address: 3fff::/20
    private-address: fc00::/7
    private-address: fe80::/10
    private-address: ff00::/8
# Add app/alternate/tunnel/same-server public IP inventory as root-owned
# local-zone refuse/private-address entries. Gate ALSO validates the complete
# chain and every A/AAAA answer; DNS filtering alone never authorizes a request.
