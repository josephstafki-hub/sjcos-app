# SJC OS — nginx reverse proxy for os.sjcarpentryllc.com
# Path: os.sjcarpentryllc.com -> 127.0.0.1:3017 (Next.js prod, systemd user service sjcos.service)
#
# Install on the box:
#   sudo cp deploy/nginx-sjcos.conf /etc/nginx/sites-available/sjcos
#   sudo ln -s /etc/nginx/sites-available/sjcos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d os.sjcarpentryllc.com   # injects the 443 block + HTTP->HTTPS redirect
#
# This file is the PRE-TLS (port 80) form. `certbot --nginx` rewrites the live
# copy in sites-available to add TLS; treat that copy as canonical afterward.

server {
    listen 80;
    listen [::]:80;
    server_name os.sjcarpentryllc.com;

    # File uploads cap at 25MB in the app (next.config serverActions bodySizeLimit);
    # 30M leaves headroom. nginx's 1M default would 413 uploads.
    client_max_body_size 30M;

    # Local Qwen (Ollama, CPU) responses can take ~10-20s; don't drop the connection.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
