# SJC OS — nginx reverse proxy for os.sjcarpentryllc.com
# Path: os.sjcarpentryllc.com -> 127.0.0.1:3017 (Next.js prod, systemd user service sjcos.service)
#
# Install on the box:
#   sudo cp deploy/nginx-sjcos.conf /etc/nginx/sites-available/sjcos
#   sudo ln -s /etc/nginx/sites-available/sjcos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d os.sjcarpentryllc.com   # injects the 443 block + HTTP->HTTPS redirect
#
# This file is the PRE-TLS (port 80) form. `certbot --nginx` rewrites the live
# copy in sites-available to add TLS; treat that copy as canonical afterward.

server {
    listen 80;
    listen [::]:80;
    server_name os.sjcarpentryllc.com;

    # File uploads cap at 25MB in the app (next.config serverActions bodySizeLimit);
    # 30M leaves headroom. nginx's 1M default would 413 uploads.
    client_max_body_size 30M;

    # Local Qwen (Ollama, CPU) responses can take ~10-20s; don't drop the connection.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # claude.ai probes these OAuth-discovery paths before connecting to an MCP
    # URL; the app's auth middleware 307s unknown paths to /login, which
    # claude.ai misreads as a sign-in service and then fails dynamic client
    # registration. Hard-404 them so the connector falls back to plain no-auth.
    # Scoped to oauth*/openid-configuration only — /.well-known/acme-challenge
    # (certbot) is untouched.
    location ^~ /.well-known/oauth {
        return 404;
    }
    location = /.well-known/openid-configuration {
        return 404;
    }

    # MCP Streamable HTTP transport -> sjcos-mcp.service on 127.0.0.1:3018.
    # Bearer-gated inside the MCP server (MCP_HTTP_TOKEN); nginx just forwards.
    # SSE streams stay open, so buffering is off and the read timeout is long.
    location /mcp {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # claude.ai custom-connector entry: claude.ai can't send a static bearer
    # token (its connector dialog is OAuth-or-nothing), so this unguessable
    # path IS the credential — nginx injects the Authorization header the MCP
    # server requires. Same pattern as ordinem.net. When installing, replace
    # both placeholders with the live values (path segment: `openssl rand -hex
    # 16`; token: MCP_HTTP_TOKEN from .env.local) — never commit either.
    # Rotate by changing the path and MCP_HTTP_TOKEN together.
    location = /mcp-connect-__RANDOM_PATH_SEGMENT__ {
        proxy_pass http://127.0.0.1:3018/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer __MCP_HTTP_TOKEN__";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
