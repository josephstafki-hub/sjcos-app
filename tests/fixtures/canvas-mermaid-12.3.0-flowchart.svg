<svg id="canvas-x-flowchart" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 168px;" viewBox="0 0 168 350" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#canvas-x-flowchart{font-family:system-ui;font-size:16px;fill:#172033;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#canvas-x-flowchart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#canvas-x-flowchart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#canvas-x-flowchart .error-icon{fill:hsl(45.8823529412, 100%, 100%);}#canvas-x-flowchart .error-text{fill:#000000;stroke:#000000;}#canvas-x-flowchart .edge-thickness-normal{stroke-width:1px;}#canvas-x-flowchart .edge-thickness-thick{stroke-width:3.5px;}#canvas-x-flowchart .edge-pattern-solid{stroke-dasharray:0;}#canvas-x-flowchart .edge-thickness-invisible{stroke-width:0;fill:none;}#canvas-x-flowchart .edge-pattern-dashed{stroke-dasharray:3;}#canvas-x-flowchart .edge-pattern-dotted{stroke-dasharray:2;}#canvas-x-flowchart .marker{fill:#475569;stroke:#475569;}#canvas-x-flowchart .marker.cross{stroke:#475569;}#canvas-x-flowchart svg{font-family:system-ui;font-size:16px;}#canvas-x-flowchart p{margin:0;}#canvas-x-flowchart .label{font-family:system-ui;color:#172033;}#canvas-x-flowchart .cluster-label text{fill:#000000;}#canvas-x-flowchart .cluster-label span{color:#000000;}#canvas-x-flowchart .cluster-label span p{background-color:transparent;}#canvas-x-flowchart .label text,#canvas-x-flowchart span{fill:#172033;color:#172033;}#canvas-x-flowchart .node rect,#canvas-x-flowchart .node circle,#canvas-x-flowchart .node ellipse,#canvas-x-flowchart .node polygon,#canvas-x-flowchart .node path{fill:#eef2ff;stroke:#64748b;stroke-width:1px;}#canvas-x-flowchart .rough-node .label text,#canvas-x-flowchart .node .label text,#canvas-x-flowchart .image-shape .label,#canvas-x-flowchart .icon-shape .label{text-anchor:middle;}#canvas-x-flowchart .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#canvas-x-flowchart .rough-node .label,#canvas-x-flowchart .node .label,#canvas-x-flowchart .image-shape .label,#canvas-x-flowchart .icon-shape .label{text-align:center;}#canvas-x-flowchart .node.clickable{cursor:pointer;}#canvas-x-flowchart .root .anchor path{fill:#475569!important;stroke-width:0;stroke:#475569;}#canvas-x-flowchart .arrowheadPath{fill:#0b0b0b;}#canvas-x-flowchart .edgePaths .path{stroke:#475569;stroke-width:1px;}#canvas-x-flowchart .flowchart-link{stroke:#475569;fill:none;}#canvas-x-flowchart .edgeLabel{background-color:hsl(105.8823529412, 100%, 96.6666666667%);text-align:center;}#canvas-x-flowchart .edgeLabel p{background-color:hsl(105.8823529412, 100%, 96.6666666667%);}#canvas-x-flowchart .edgeLabel rect{opacity:0.5;background-color:hsl(105.8823529412, 100%, 96.6666666667%);fill:hsl(105.8823529412, 100%, 96.6666666667%);}#canvas-x-flowchart .labelBkg{background-color:rgba(242.0000000001, 255, 238.0000000002, 0.5);}#canvas-x-flowchart .cluster rect{fill:hsl(45.8823529412, 100%, 100%);stroke:hsl(45.8823529412, 60%, 90%);stroke-width:1px;}#canvas-x-flowchart .cluster text{fill:#000000;}#canvas-x-flowchart .cluster span{color:#000000;}#canvas-x-flowchart .node .collapsed-indicator{fill:hsl(45.8823529412, 60%, 90%);stroke:none;opacity:0.6;}#canvas-x-flowchart .node .collapsed-separator{stroke:hsl(45.8823529412, 60%, 90%);stroke-width:0.75px;}#canvas-x-flowchart div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:system-ui;font-size:12px;background:hsl(45.8823529412, 100%, 100%);border:1px solid hsl(45.8823529412, 60%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#canvas-x-flowchart .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172033;}#canvas-x-flowchart rect.text{fill:none;stroke-width:0;}#canvas-x-flowchart .icon-shape,#canvas-x-flowchart .image-shape{background-color:hsl(105.8823529412, 100%, 96.6666666667%);text-align:center;}#canvas-x-flowchart .icon-shape p,#canvas-x-flowchart .image-shape p{background-color:hsl(105.8823529412, 100%, 96.6666666667%);padding:2px;}#canvas-x-flowchart .icon-shape .label rect,#canvas-x-flowchart .image-shape .label rect{opacity:0.5;background-color:hsl(105.8823529412, 100%, 96.6666666667%);fill:hsl(105.8823529412, 100%, 96.6666666667%);}#canvas-x-flowchart .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#canvas-x-flowchart .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#canvas-x-flowchart .node .neo-node{stroke:#64748b;}#canvas-x-flowchart [data-look="neo"].node rect,#canvas-x-flowchart [data-look="neo"].cluster rect,#canvas-x-flowchart [data-look="neo"].node polygon{stroke:url(#canvas-x-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#canvas-x-flowchart [data-look="neo"].swimlane.cluster rect{filter:none;}#canvas-x-flowchart [data-look="neo"].node path{stroke:url(#canvas-x-flowchart-gradient);stroke-width:1px;}#canvas-x-flowchart [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#canvas-x-flowchart [data-look="neo"].node .neo-line path{stroke:#64748b;filter:none;}#canvas-x-flowchart [data-look="neo"].node circle{stroke:url(#canvas-x-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#canvas-x-flowchart [data-look="neo"].node circle .state-start{fill:#000000;}#canvas-x-flowchart [data-look="neo"].icon-shape .icon{fill:url(#canvas-x-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#canvas-x-flowchart [data-look="neo"].icon-shape .icon-neo path{stroke:url(#canvas-x-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#canvas-x-flowchart :root{--mermaid-font-family:system-ui;}</style><g><marker id="canvas-x-flowchart_flo